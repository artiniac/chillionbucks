# Publishes this static site to GitHub Pages on every push to main.
# First run: turns Pages ON for the repo (enablement) and points it at the
# custom domain, so the only manual step left is DNS at the registrar.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Set the custom domain (chillionbucks.com) and enforce HTTPS once the certificate exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f cname="chillionbucks.com" \
            && echo "custom domain set to chillionbucks.com" \
            || echo "could not set the custom domain automatically; set it under Settings > Pages"
          gh api -X PUT "repos/${{ github.repository }}/pages" -F https_enforced=true \
            && echo "HTTPS enforced" \
            || echo "HTTPS enforcement waits for the certificate; it retries on the next deploy"
